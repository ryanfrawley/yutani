[workspace]

[package]
name = "yutani"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.bundle]
name = "Yutani"
identifier = "co.frawley.yutani"
category = "public.app-category.developer-tools"
short_description = "Yutani terminal"
# yutani.icns and Assets.car are produced from yutani.icon by
# scripts/bundle-mac.sh; do not invoke `cargo bundle` directly on macOS.
icon = ["target/macos-icon/yutani.icns"]

[dependencies]
bytemuck = { version = "1.14.0", features = ["derive"] }
env_logger = "0.10.1"
freetype-rs = "0.34.1"
pollster = "0.3.0"
wgpu = "0.18.0"
winit = { version = "0.30", features = ["rwh_05"] }
libc = "0.2.15"
cgmath = "0.18.0"
nix = { version = "0.27.1", features = ["process"] }
arboard = "3"
harfbuzz_rs = { version = "2", default-features = false, features = ["build-native-harfbuzz"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.21"
flate2 = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", default-features = false, features = ["winuser", "wingdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "19"
core-foundation = "0.9"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAlert",
    "NSColor",
    "NSCursor",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSEvent",
] }
raw-window-handle = "0.5"
